schema_version: 1

context:
  name: notebook-frontend
  version: "7.6.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 67cff01a4ae65d9c97a1336c0e6f835e98b7545be205d6f67438d5b25181c68c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - jupyterlab-js =4.6.2

tests:
  - python:
      imports:
        - notebook_frontend
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: A Python package distributing Notebook's static assets
  homepage: https://github.com/davidbrochart/notebook-frontend
  repository: https://github.com/davidbrochart/notebook-frontend

extra:
  recipe-maintainers:
    - davidbrochart
