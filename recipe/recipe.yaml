schema_version: 1

context:
  name: notebook-frontend
  version: "7.6.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: f0a69baefec2dd2cc53be167e990dc89ee85e8a3f38ee8082432503cc010439e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - jupyterlab-js =4.6.2

tests:
  - python:
      imports:
        - notebook_frontend
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: A Python package distributing Notebook's static assets
  homepage: https://github.com/davidbrochart/notebook-frontend
  repository: https://github.com/davidbrochart/notebook-frontend

extra:
  recipe-maintainers:
    - davidbrochart
